name: Validate

# GitHub Pages serves index.html straight from the branch, so a syntax error is live within a
# minute of the push. This runs the same checks that were being done by hand before every deploy.

# Read-only: these jobs only check out the code and call a service.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Check index.html, sw.js and the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node .github/scripts/validate.mjs
