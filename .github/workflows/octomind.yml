name: E2E tests (Octomind)

# Runs Octomind's end-to-end tests against the live site after a push has been served.
# Setup (one time, in the repository's Settings):
#   Secrets and variables → Actions → Secrets:   OCTOMIND_API_KEY        (Octomind → Settings → API key)
#   Secrets and variables → Actions → Variables: OCTOMIND_TEST_TARGET_ID (Octomind → Settings → test target)
# Until the variable exists the job is skipped, so pushes stay green while you set it up.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
  workflow_dispatch:

concurrency:
  group: octomind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run Octomind tests
    runs-on: ubuntu-latest
    if: ${{ vars.OCTOMIND_TEST_TARGET_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages serves this repository's branch directly, and that takes a minute or two.
      # Testing before it lands would test the previous release, so wait for the version in
      # this commit to actually be the one on the air.
      - name: Wait for GitHub Pages to serve this commit
        run: |
          want=$(grep -o 'APP_VERSION="v[0-9]\+"' index.html | head -1)
          echo "waiting for $want"
          for i in $(seq 1 40); do
            live=$(curl -s -H 'Cache-Control: no-cache' \
              "https://amber67-git.github.io/classdesk/?ci=$GITHUB_RUN_ID-$i" \
              | grep -o 'APP_VERSION="v[0-9]\+"' | head -1)
            if [ "$live" = "$want" ]; then
              echo "live after ~$((i * 15))s"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Pages did not serve $want within 10 minutes — testing whatever is live ($live)"

      - name: Execute tests
        uses: OctoMind-dev/automagically-action-execute@v2
        with:
          url: https://amber67-git.github.io/classdesk/
          token: ${{ secrets.OCTOMIND_API_KEY }}
          testTargetId: ${{ vars.OCTOMIND_TEST_TARGET_ID }}
          blocking: true
