# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# ClassDesk — CodeRabbit review settings.
# Reviews happen on PULL REQUESTS. Pushing straight to main is not reviewed, so open a PR
# (even a one-commit one) when you want a second pair of eyes before it goes live.

language: ko-KR

tone_instructions: >-
  한국어로 짧고 구체적으로. 금액 계산과 데이터 손실 위험을 최우선으로 보고,
  취향에 가까운 스타일 지적은 생략.

reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!icons/**"

  path_instructions:
    - path: "index.html"
      instructions: |
        이 파일 하나가 앱 전체다. 빌드 단계도, 번들러도, 외부 패키지도 없다.
        import/require 를 추가하거나 코드를 별도 파일로 빼자는 제안은 하지 말 것.
        GitHub Pages 가 이 파일을 그대로 서빙한다.

        변경마다 확인할 것:
        - APP_VERSION 을 같이 올렸는지. 배포 확인이 이 값으로 이루어진다.
        - 주 사용자는 한 명(원장)이고 데이터는 localStorage + Firestore 에 들어 있다.
          마이그레이션 없이 저장 형식을 바꾸면 기존 데이터가 깨진다.

        과거에 실제로 돈과 데이터를 잃게 만든 함정들이다. 아래에 해당하면 반드시 지적할 것:

        1. 배열에서 항목을 지울 때는 splice() 로 제자리에서 지운다.
           arr = arr.filter(...) 처럼 재할당하면 동기화 계층과 렌더러가 예전 배열을
           들고 있어서 지운 항목이 되살아난다.
        2. 고정 시간표에 걸린 수업 기록을 지울 때는 레코드를 제거하지 말고
           status:"deleted" 로 묘비(tombstone)를 남겨야 한다. 지우면 시간표가 다시 만들어낸다.
        3. 시간 조회 함수(getSlotsForStudent, pickSlotForDate, getLessonTimeKey,
           schedLabelForOcc)에는 항상 날짜를 넘겨야 한다. 한 군데라도 빠뜨리면
           과거 수업이 바뀐 시간표로 표시된다.
        4. calcM() 안의 s 는 reduce 누산기이지 학생이 아니다. 학생은 gs(sid) 로 얻는다.
        5. 금액에 닿는 변경(calcM, amt, status, 발생 횟수 생성)은 다음 불변식을 지켜야 한다:
           대시보드 합계 = Payments 요약 행 합계. 취소된 수업은 예상 금액에서 빠지고,
           cancelpaid 는 받은 돈이므로 포함된다.
        6. 하루에 수업을 새로 추가하는 경로는 먼저 materialiseUnclaimedSlots(sid,date) 를
           불러야 한다. 안 그러면 새 기록이 그날 정규 수업의 자리를 빼앗아
           정규 수업이 화면과 월 합계에서 사라진다.
        7. 취소는 amt 를 0 으로 저장한다. 취소를 되돌리는 코드는 금액을 반드시 다시 채워야
           한다. 안 그러면 수업 횟수는 늘고 요금은 0 원이 된다.
        8. 동기화는 레코드별 _u 타임스탬프로 비교한다. 로드 시점이나 일괄 작업에서
           _u 를 다시 찍으면 오래된 기기가 클라우드를 이긴다. 절대 금지.
        9. 모달은 class "show" 로 연다(openModal). "open" 이 아니다.
        10. <th> 에 position 을 인라인으로 주지 말 것. sticky 헤더가 풀린다.
        11. 한글 문자열을 부분 치환하지 말 것. 단어 중간이 깨진다. 문구 전체를 바꾼다.

        UI 규칙:
        - 페이지 사이 통일감이 최우선이다. 한 페이지에만 다른 폭이나 다른 툴바를 주지 않는다.
        - 툴바(.fbar) 크기는 고정이다: select 160px, 검색 280px, 주 버튼 150px, 높이 34px.
        - 색은 CSS 토큰만 쓴다. hex 를 직접 쓰지 않는다. 쓸 수 있는 토큰은 이 파일 :root 에 정의된
          것 전부다: 주색 --pri*, 성공 --ok*, 경고 --amb*, 위험 --red*, 글자 --txt/--txt2/--txt3,
          면 --surf/--surf2, 테두리 --bdr/--bdr2. 정의되지 않은 토큰(--amb-t 같은)을 쓰면 지적할 것.
        - 아이콘만 있는 버튼에는 title 을 단다.

    - path: "sw.js"
      instructions: |
        서비스 워커다. 같은 출처 요청만 network-first 로 처리하고,
        Firebase/폰트/CDN 같은 교차 출처 요청은 손대지 않고 통과시켜야 한다.
        페이지를 캐시 우선으로 바꾸면 사용자가 옛 버전에 갇힌다.

    - path: "**/*.md"
      instructions: |
        DESIGN.md 는 다른 앱이 이 디자인을 따라 만들 때 쓰는 공개 규격서다.
        CSS 가 바뀌었는데 이 문서가 그대로면 지적할 것.

  tools:
    htmlhint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
